openapi: 3.1.0
info:
  title: MyPoS application contract
  version: 1.1.0
  description: >-
    Frozen common API contract from T004. Owning tickets may add fields and paths without
    weakening tenant, authorization, idempotency, decimal-string or error semantics.
servers:
  - url: /api/v1
    description: Same-origin application API
security:
  - cookieAuth: []
tags:
  - name: Fiscal
    description: Gated authority configurations, immutable submissions and exception reconciliation.
  - name: Notifications
    description: Durable transactional email/SMS/WhatsApp delivery and role/store scoped in-app alerts.
  - name: Integrations
    description: Merchant-owned redacted provider configuration, safe tests and authenticated callbacks.
  - name: Data transfer
    description: Versioned CSV preview/commit imports and expiring queued exports.
  - name: Reporting
    description: Fixed, authorized operational reports, drill-down and personal filters.
  - name: Workforce
    description: Employment records, rota, attendance, leave and immutable payroll inputs.
  - name: Platform
    description: Platform-only merchant provisioning, plans, manual subscriptions and controlled support access.
  - name: Authentication
    description: Browser sessions, account recovery, fixed roles and device-bound staff authorization.
  - name: Tenancy
    description: Merchant onboarding, authorized stores and server-validated store context.
  - name: Checkout
    description: Cart pricing and quote operations.
  - name: Customers
    description: Scoped operational customer profiles, groups and explicit loyalty identity links.
  - name: Sales
    description: Posted sales, returns and exchanges.
  - name: Cash
    description: Register sessions, counts and cash movements.
  - name: Purchasing
    description: Purchase orders and goods receipts.
  - name: Inventory
    description: Inventory movements, transfers and counts.
  - name: Loyalty
    description: Staff and limited public loyalty operations.
  - name: Offline
    description: Device bootstrap and durable command ingestion.
  - name: Devices
    description: Register-device enrollment and authorization.
  - name: Operations
    description: Printing and common operational resources.
paths:
  /health:
    get: {tags: [Operations], operationId: getLiveness, security: [], responses: {'200': {description: Minimal process liveness and request identity}}}
  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      security: []
      parameters: [{name: X-Health-Key, in: header, required: true, schema: {type: string}}]
      responses: {'200': {description: Protected dependency readiness}, '404': {description: Missing or invalid probe key}, '503': {description: A required dependency or scheduler heartbeat is unhealthy}}
  /platform/plans:
    get:
      tags: [Platform]
      operationId: listPlatformPlans
      summary: List plans and entitlement definitions as an active platform operator
      responses:
        '200': {description: Plans, content: {application/json: {schema: {$ref: '#/components/schemas/PlanListEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Platform]
      operationId: createPlatformPlan
      summary: Define a manually administered plan and its entitlements
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePlanRequest'}}}}
      responses:
        '201': {description: Plan created, content: {application/json: {schema: {$ref: '#/components/schemas/PlanEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /platform/plans/{planId}:
    get:
      tags: [Platform]
      operationId: getPlatformPlan
      summary: Read one plan and its entitlements
      parameters: [{$ref: '#/components/parameters/PlanId'}]
      responses:
        '200': {description: Plan, content: {application/json: {schema: {$ref: '#/components/schemas/PlanEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /platform/merchants:
    post:
      tags: [Platform]
      operationId: provisionPlatformMerchant
      summary: Provision a merchant, first owner/store and initial subscription without operator impersonation
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProvisionMerchantRequest'}}}}
      responses:
        '201': {description: Merchant provisioned, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /platform/merchants/{merchantId}/subscription:
    post:
      tags: [Platform]
      operationId: assignMerchantSubscription
      summary: Assign the only subscription to an existing merchant
      parameters: [{$ref: '#/components/parameters/MerchantId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignSubscriptionRequest'}}}}
      responses:
        '201': {description: Subscription assigned, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /platform/subscriptions/{subscriptionId}:
    patch:
      tags: [Platform]
      operationId: transitionMerchantSubscription
      summary: Apply an audited subscription lifecycle transition
      parameters: [{$ref: '#/components/parameters/SubscriptionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransitionSubscriptionRequest'}}}}
      responses:
        '200': {description: Subscription transitioned, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /platform/subscriptions/{subscriptionId}/payments:
    post:
      tags: [Platform]
      operationId: recordManualSubscriptionPayment
      summary: Idempotently record external payment evidence and renew a subscription
      description: Records a staff-verified external reference; it does not acquire or independently verify payment and is separate from POS tenders.
      parameters: [{$ref: '#/components/parameters/SubscriptionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordSubscriptionPaymentRequest'}}}}
      responses:
        '201': {description: Original or newly recorded payment result, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionPaymentEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /platform/support-access-grants:
    post:
      tags: [Platform]
      operationId: createSupportAccessGrant
      summary: Create a purpose-bound and expiring merchant support grant
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateSupportAccessGrantRequest'}}}}
      responses:
        '201': {description: Grant created, content: {application/json: {schema: {$ref: '#/components/schemas/SupportAccessGrantEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /platform/merchants/{merchantId}/diagnostics:
    get:
      tags: [Platform]
      operationId: getScopedSupportDiagnostics
      summary: Read bounded tenant diagnostics using an active diagnostics grant
      parameters: [{$ref: '#/components/parameters/MerchantId'}]
      responses:
        '200': {description: Minimal merchant-scoped diagnostics without secrets or cross-merchant reports}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Start a browser session for an active user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated user; the server regenerates the session identifier
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthenticatedUserEnvelope'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/logout:
    delete:
      tags: [Authentication]
      operationId: logout
      summary: End the browser session and rotate its CSRF token
      responses:
        '200':
          description: Session invalidated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogoutEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Accept a password reset request without revealing account existence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '202':
          description: Request accepted for both known and unknown email addresses
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedEnvelope'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Replace a password using a valid reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200':
          description: Password replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResetEnvelope'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /merchants/{merchantId}/stores/{storeId}/registers:
    get:
      tags: [Devices]
      operationId: listRegisters
      summary: List registers and enrolled devices in an authorized store
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      responses:
        '200': {description: Store registers, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterListEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Devices]
      operationId: createRegister
      summary: Create a register with declared hardware capabilities
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateRegisterRequest'}}}}
      responses:
        '201': {description: Register created, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}:
    get:
      tags: [Devices]
      operationId: getRegister
      summary: Read one register and its device state
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}]
      responses:
        '200': {description: Register, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/pairing-codes:
    post:
      tags: [Devices]
      operationId: issueDevicePairingCode
      summary: Issue a short-lived, one-time device pairing code
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/CreatePairingCodeRequest'}}}}
      responses:
        '201': {description: Pairing code shown once, content: {application/json: {schema: {$ref: '#/components/schemas/PairingCodeEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /device-pairings/consume:
    post:
      tags: [Devices]
      operationId: consumeDevicePairingCode
      summary: Enroll a browser by consuming a valid pairing code once
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConsumePairingCodeRequest'}}}}
      responses:
        '201': {description: Device key shown once with the enrolled device, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceEnrollmentSecretEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /merchants/{merchantId}/stores/{storeId}/devices/{deviceId}:
    delete:
      tags: [Devices]
      operationId: revokeDevice
      summary: Revoke a device and its active staff sessions
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/DeviceId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RevokeDeviceRequest'}}}}
      responses:
        '200': {description: Revoked device, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /devices/{deviceId}/bootstrap:
    get:
      tags: [Devices, Offline]
      operationId: bootstrapDevice
      summary: Return only the enrolled register, tenant and effective published configuration
      security: []
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/DeviceKey'}]
      responses:
        '200': {description: Scoped device bootstrap, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceBootstrapEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /merchants/{merchantId}/settings:
    get:
      tags: [Devices]
      operationId: listMerchantSettingsVersions
      summary: List retained merchant settings versions
      parameters: [{$ref: '#/components/parameters/MerchantId'}]
      responses:
        '200': {description: Merchant settings history, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsVersionListEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Devices]
      operationId: publishMerchantSettings
      summary: Append an effective-time merchant settings version
      parameters: [{$ref: '#/components/parameters/MerchantId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublishSettingsRequest'}}}}
      responses:
        '201': {description: Settings version published, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsVersionEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/settings/{storeId}:
    get:
      tags: [Devices]
      operationId: listStoreSettingsVersions
      summary: List retained store override versions
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      responses:
        '200': {description: Store settings history, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsVersionListEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Devices]
      operationId: publishStoreSettings
      summary: Append a store settings override; no register-level override exists
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublishSettingsRequest'}}}}
      responses:
        '201': {description: Settings version published, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsVersionEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/catalog/units:
    get:
      tags: [Operations]
      operationId: listCatalogUnits
      summary: List active merchant units available in an authorized store
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      responses:
        '200': {description: Units, content: {application/json: {schema: {$ref: '#/components/schemas/UnitListEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Operations]
      operationId: createCatalogUnit
      summary: Create a merchant unit of measure
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUnitRequest'}}}}
      responses:
        '201': {description: Unit created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/catalog/products:
    get:
      tags: [Operations]
      operationId: listCatalogProducts
      summary: Bounded product search in the store's shared or independent catalog
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Paginated products, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogProductListEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Operations]
      operationId: createCatalogProduct
      summary: Atomically create a product, variants, barcodes, conversions, bundle components and extras
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCatalogProductRequest'}}}}
      responses:
        '201': {description: Product created, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogProductEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/catalog/products/{productId}:
    get:
      tags: [Operations]
      operationId: getCatalogProduct
      summary: Read an active or archived product for current or historical display
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogProductEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Operations]
      operationId: updateCatalogProduct
      summary: Version a product metadata, availability, archive or batch-tracking change
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/ProductId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateCatalogProductRequest'}}}}
      responses:
        '200': {description: Updated product, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogProductEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/catalog/variants/{variantId}/bundle-components:
    put:
      tags: [Operations]
      operationId: replaceBundleComponents
      summary: Replace a fixed bundle graph with version and cycle checks
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/VariantId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReplaceBundleComponentsRequest'}}}}
      responses:
        '200': {description: Versioned bundle product, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogProductEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/catalog/barcode:
    get:
      tags: [Operations]
      operationId: resolveCatalogBarcode
      summary: Resolve an exact or configured variable-measure barcode without dropping leading zeros
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {name: barcode, in: query, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '200': {description: Scan interpretation and product, content: {application/json: {schema: {$ref: '#/components/schemas/BarcodeResolutionEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/catalog/scale-formats:
    get:
      tags: [Operations]
      operationId: listScaleBarcodeFormats
      summary: List merchant defaults and current-store scale-label formats
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      responses: {'200': {description: Configured formats}}
    post:
      tags: [Operations]
      operationId: createScaleBarcodeFormat
      summary: Configure bounded label fields and optional EAN-13 checksum verification
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateScaleBarcodeFormatRequest'}}}}
      responses:
        '201': {description: Scale format created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/catalog/products/{productId}/images:
    post:
      tags: [Operations]
      operationId: uploadCatalogProductImage
      summary: Validate and store an image under a tenant-isolated private path
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/ProductId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [image], properties: {image: {type: string, format: binary}, alt_text: {type: [string, 'null'], maxLength: 180}}}
      responses:
        '201': {description: Safe image metadata without storage path}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/catalog/products/{productId}/images/{imageId}:
    get:
      tags: [Operations]
      operationId: readCatalogProductImage
      summary: Stream one tenant- and product-bound image after catalog authorization
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/ProductId'}, {$ref: '#/components/parameters/ImageId'}]
      responses:
        '200': {description: Private image bytes}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Operations]
      operationId: deleteCatalogProductImage
      summary: Delete one tenant- and product-bound image
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/ProductId'}, {$ref: '#/components/parameters/ImageId'}]
      responses:
        '200': {description: Image removed}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/pricing/versions:
    get:
      tags: [Operations]
      operationId: listPricingVersions
      summary: Read effective version signature and bounded merchant/store pricing history
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      responses:
        '200': {description: Effective signature and up to 100 immutable snapshots}
        '409': {$ref: '#/components/responses/Conflict'}
    post:
      tags: [Operations]
      operationId: publishPricingVersion
      summary: Publish an append-only merchant default or current-store override
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublishPricingVersionRequest'}}}}
      responses:
        '201': {description: Pricing snapshot published, content: {application/json: {schema: {$ref: '#/components/schemas/PricingVersionEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/pricing/quote:
    post:
      tags: [Checkout]
      operationId: calculatePricingQuote
      summary: Resolve a deterministic, non-consuming quote from effective pricing snapshots
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CalculatePricingQuoteRequest'}}}}
      responses:
        '200': {description: Quote and line allocation explanation, content: {application/json: {schema: {$ref: '#/components/schemas/PricingQuoteEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
