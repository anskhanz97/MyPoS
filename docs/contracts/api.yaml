      type: object
      additionalProperties: false
      required: [name, code, timezone]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        code: {type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 40}
        timezone: {type: string}
    TenantContext:
      type: object
      additionalProperties: false
      required: [merchant_id, store_id]
      properties:
        merchant_id: {$ref: '#/components/schemas/Uuid'}
        store_id: {$ref: '#/components/schemas/Uuid'}
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    NullableUuid:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    Money:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,11})\.[0-9]{2}$'
      examples: ['1250.00']
    PositiveMoney:
      type: string
      pattern: '^[1-9][0-9]{0,14}(\.[0-9]{1,2})?$'
      examples: ['500.00']
    Quantity:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
      examples: ['1.250000']
    PositiveQuantity:
      type: string
      pattern: '^(0\.[0-9]*[1-9][0-9]{0,5}|[1-9][0-9]{0,11}(\.[0-9]{1,6})?)$'
      examples: ['0.250000']
    Points:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,14})\.[0-9]{4}$'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id, retryable]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code:
          type: string
          enum:
            - unauthenticated
            - invalid_credentials
            - forbidden
            - not_found
            - validation_failed
            - invalid_state_transition
            - invalid_approval
            - version_conflict
            - idempotency_key_reused
            - command_in_progress
            - insufficient_stock_warning_requires_confirmation
            - expired_batch
            - snapshot_expired
            - lease_expired
            - outcome_unknown
            - dependency_unavailable
            - rate_limited
        detail: {type: [string, 'null']}
        request_id: {$ref: '#/components/schemas/Uuid'}
        retryable: {type: boolean}
        retry_after_seconds: {type: [integer, 'null'], minimum: 1}
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pointer, code, message]
            properties:
              pointer: {type: string, description: JSON Pointer}
              code: {type: string}
              message: {type: string}
        current_state: {type: [string, 'null']}
