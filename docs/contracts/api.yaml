    CreateMerchantRequest:
      type: object
      additionalProperties: false
      required: [name, slug, store_data_mode, timezone, store_name, store_code, review_confirmed]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        slug: {type: string, pattern: '^[a-z0-9_-]+$', maxLength: 100}
        store_data_mode: {enum: [shared, independent]}
        timezone: {type: string}
        store_name: {type: string, minLength: 1, maxLength: 160}
        store_code: {type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 40}
        review_confirmed: {const: true}
