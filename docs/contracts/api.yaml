      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordStocktakeCountsRequest'}}}}
      responses:
        '200': {description: Counts and discrepancies recorded, content: {application/json: {schema: {$ref: '#/components/schemas/StocktakeEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/stocktakes/{stocktakeId}/review:
    post:
      tags: [Inventory]
      operationId: reviewStocktake
      summary: Move a fully counted stocktake to review with an optimistic version check
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/StocktakeId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedVersionCommand'}}}}
      responses:
        '200': {description: Stocktake ready for posting, content: {application/json: {schema: {$ref: '#/components/schemas/StocktakeEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/stocktakes/{stocktakeId}/post:
    post:
      tags: [Inventory]
      operationId: postStocktake
      summary: Idempotently append discrepancy movements without overwriting later live movements
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/StocktakeId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PostStocktakeRequest'}}}}
      responses:
        '200': {description: Identical posting replayed, content: {application/json: {schema: {$ref: '#/components/schemas/PostedStocktakeEnvelope'}}}}
        '201': {description: Discrepancy movements posted, content: {application/json: {schema: {$ref: '#/components/schemas/PostedStocktakeEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/suppliers:
    get:
      tags: [Purchasing]
      operationId: listSuppliers
      summary: List merchant suppliers through an authorized store context
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/StoreId'
        - {name: search, in: query, schema: {type: string, maxLength: 160}}
        - {name: include_archived, in: query, schema: {type: boolean, default: false}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: Paginated supplier directory, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierPageEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Purchasing]
      operationId: createSupplier
      summary: Create a merchant supplier
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WriteSupplierRequest'}}}}
      responses:
        '201': {description: Supplier created, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/suppliers/{supplierId}:
    get:
      tags: [Purchasing]
      operationId: getSupplier
      summary: Read one supplier including archived status
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/SupplierId'}]
      responses:
        '200': {description: Supplier, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Purchasing]
      operationId: updateSupplier
      summary: Replace editable contact fields on an active supplier
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/SupplierId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WriteSupplierRequest'}}}}
      responses:
        '200': {description: Supplier updated, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Purchasing]
      operationId: archiveSupplier
      summary: Archive a supplier while preserving purchase-order references
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/SupplierId'}]
      responses:
        '200': {description: Supplier archived or identical archive replayed, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/purchase-orders:
    get:
      tags: [Purchasing]
      operationId: listPurchaseOrders
      summary: List store purchase orders and remaining quantities
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/StoreId'
        - {name: state, in: query, schema: {enum: [draft, issued, partially_received, received, cancelled]}}
        - {name: supplier_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: Paginated purchase orders, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseOrderPageEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Purchasing]
      operationId: createPurchaseOrder
      summary: Create a draft purchase order without changing stock or supplier balances
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WritePurchaseOrderRequest'}}}}
      responses:
        '201': {description: Draft purchase order created, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseOrderEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/purchase-orders/{purchaseOrderId}:
    get:
      tags: [Purchasing]
      operationId: getPurchaseOrder
      summary: Read one purchase order with lines and versioned history
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseOrderId'}]
      responses:
        '200': {description: Purchase order, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseOrderEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Purchasing]
      operationId: updatePurchaseOrder
      summary: Amend a draft or open issued order without reducing below fulfilled quantities
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseOrderId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePurchaseOrderRequest'}}}}
      responses:
        '200': {description: Versioned amendment recorded, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseOrderEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/purchase-orders/{purchaseOrderId}/issue:
    post:
      tags: [Purchasing]
      operationId: issuePurchaseOrder
      summary: Idempotently issue a current draft without posting stock
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseOrderId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionedIdempotentCommand'}}}}
      responses:
        '200': {description: Identical issue replayed, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseOrderCommandEnvelope'}}}}
        '201': {description: Purchase order issued, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseOrderCommandEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /merchants/{merchantId}/stores/{storeId}/purchase-orders/{purchaseOrderId}/cancel:
    post:
      tags: [Purchasing]
      operationId: cancelPurchaseOrder
      summary: Cancel only quantities still outstanding on an open purchase order
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseOrderId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancelPurchaseOrderRequest'}}}}
      responses:
        '200': {description: Outstanding quantities cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseOrderEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/purchase-orders/{purchaseOrderId}/pdf:
    get:
      tags: [Purchasing]
      operationId: renderPurchaseOrderPdf
      summary: Render an authorized A4 purchase-order planning document
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseOrderId'}]
      responses:
        '200': {description: Purchase-order PDF, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/purchase-orders/{purchaseOrderId}/receipts:
    get:
      tags: [Purchasing]
      operationId: listPurchaseReceipts
      summary: List posted and reversed receipts for one purchase order
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseOrderId'}]
      responses:
        '200': {description: Purchase receipts, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReceiptListEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Purchasing]
      operationId: postPurchaseReceipt
      summary: Atomically post a partial or complete goods receipt, valuation, charge and outbox event
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseOrderId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReceivePurchaseOrderRequest'}}}}
      responses:
        '200': {description: Identical receipt replayed, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReceiptCommandEnvelope'}}}}
        '201': {description: Goods receipt posted, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReceiptCommandEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/purchase-receipts/{purchaseReceiptId}:
    get:
      tags: [Purchasing]
      operationId: getPurchaseReceipt
      summary: Read receipt stock, batch, charge and valuation evidence
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseReceiptId'}]
      responses:
        '200': {description: Purchase receipt, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReceiptEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/purchase-receipts/{purchaseReceiptId}/reverse:
    post:
      tags: [Purchasing]
      operationId: reversePurchaseReceipt
      summary: Reverse the latest safe receipt with append-only stock, valuation and charge evidence
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseReceiptId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReversePurchaseReceiptRequest'}}}}
      responses:
        '200': {description: Receipt reversed or identical reversal replayed, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReceiptCommandEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/purchase-receipts/{purchaseReceiptId}/returns:
    get:
      tags: [Purchasing]
      operationId: listPurchaseReturns
      summary: List posted and reversed physical returns linked to one receipt
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseReceiptId'}]
      responses:
        '200': {description: Purchase returns, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReturnListEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Purchasing]
      operationId: postPurchaseReturn
      summary: Atomically return eligible received stock and create expected or confirmed supplier-credit evidence
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseReceiptId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PostPurchaseReturnRequest'}}}}
      responses:
        '200': {description: Identical return replayed, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReturnCommandEnvelope'}}}}
        '201': {description: Purchase return posted, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReturnCommandEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/purchase-returns/{purchaseReturnId}:
    get:
      tags: [Purchasing]
      operationId: getPurchaseReturn
      summary: Read physical return, valuation and supplier-credit evidence
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseReturnId'}]
      responses:
        '200': {description: Purchase return, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReturnEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/purchase-returns/{purchaseReturnId}/reverse:
    post:
      tags: [Purchasing]
      operationId: reversePurchaseReturn
      summary: Reverse a tail-safe purchase return with append-only stock, cost and credit entries
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/PurchaseReturnId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReversePurchaseReceiptRequest'}}}}
      responses:
        '200': {description: Purchase return reversed or replayed, content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseReturnCommandEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /merchants/{merchantId}/stores/{storeId}/supplier-credits/{supplierCreditId}/confirm:
    post:
      tags: [Purchasing]
      operationId: confirmSupplierCredit
      summary: Confirm expected credit evidence against a supplier document reference
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/SupplierCreditId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmSupplierCreditRequest'}}}}
      responses:
        '200': {description: Credit confirmed, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierCreditEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /merchants/{merchantId}/stores/{storeId}/suppliers/{supplierId}/statement:
    get:
      tags: [Purchasing]
      operationId: getSupplierStatement
      summary: Read store or owner-authorized merchant supplier balance from immutable entries
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/SupplierId'}
        - {name: scope, in: query, schema: {enum: [store, merchant], default: store}}
      responses:
        '200': {description: Supplier statement, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierStatementEnvelope'}}}}
  /merchants/{merchantId}/stores/{storeId}/suppliers/{supplierId}/payments:
    post:
      tags: [Purchasing]
      operationId: postSupplierPayment
      summary: Record an external supplier payment and explicit charge allocations without initiating funds transfer
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/SupplierId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PostSupplierPaymentRequest'}}}}
      responses:
        '200': {description: Identical payment replayed, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierPaymentCommandEnvelope'}}}}
        '201': {description: Supplier payment recorded, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierPaymentCommandEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /merchants/{merchantId}/stores/{storeId}/supplier-payments/{supplierPaymentId}/reverse:
    post:
      tags: [Purchasing]
      operationId: reverseSupplierPayment
      summary: Append a supplier payment and allocation reversal
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/SupplierPaymentId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReverseSupplierPaymentRequest'}}}}
      responses:
        '200': {description: Existing reversal replayed, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierPaymentCommandEnvelope'}}}}
        '201': {description: Supplier payment reversed, content: {application/json: {schema: {$ref: '#/components/schemas/SupplierPaymentCommandEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /devices/{deviceId}/staff-sessions:
    post:
      tags: [Authentication, Devices]
      operationId: switchDeviceStaff
      summary: Start a device-bound staff session using a PIN
      description: Requires the enrolled device secret in X-Device-Key. A PIN is not accepted as an internet login credential.
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SwitchStaffRequest'}
      responses:
        '201':
          description: Previous active staff session for the device revoked; new opaque token returned once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffSessionEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /devices/{deviceId}/approvals:
    post:
      tags: [Authentication, Devices]
      operationId: issueDeviceApproval
      summary: Issue an action, scope and target-bound one-time approval
      description: Requires the requester's X-Staff-Session token and a different authorized approver's PIN.
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/StaffSession'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateApprovalRequest'}
      responses:
        '201':
          description: Approval created; opaque five-minute token returned once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /merchants/{merchantId}/permissions:
    get:
      tags: [Authentication]
      operationId: listCurrentPermissions
      summary: Return the authenticated membership's fixed role and permission codes
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          description: Server-authoritative permissions for navigation and client affordances
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/memberships:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    get:
      tags: [Authentication]
      operationId: listMerchantMemberships
      summary: List staff memberships as a merchant owner
      responses:
        '200':
          description: Staff membership list without secret hashes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MembershipListEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Authentication]
      operationId: createMerchantMembership
      summary: Create a manager or cashier membership as a merchant owner
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMembershipRequest'}
      responses:
        '201':
          description: Membership created and account setup notification requested when needed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MembershipEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/memberships/{membershipId}:
    patch:
      tags: [Authentication]
      operationId: updateMerchantMembership
      summary: Change a non-owner role, status, PIN or store assignments as a merchant owner
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMembershipRequest'}
      responses:
        '200':
          description: Membership updated and all active device sessions for it revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MembershipEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/subscription:
    get:
      tags: [Platform]
      operationId: getOwnerSubscription
      summary: Read the merchant's subscription, renewal status and effective capabilities as an owner
      parameters: [{$ref: '#/components/parameters/MerchantId'}]
      responses:
        '200': {description: Read-only subscription view, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants:
    get:
      tags: [Tenancy]
      operationId: listMerchants
      summary: List active merchant memberships for the authenticated user
      responses:
        '200':
          description: Authorized merchants only
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Merchant'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Tenancy]
      operationId: createMerchant
      summary: Activate a reviewed merchant, lock its ownership mode and create the first store
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMerchantRequest'}
      responses:
        '201':
          description: Merchant activated and ownership mode locked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Merchant'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    get:
      tags: [Tenancy]
      operationId: listMerchantStores
      summary: List stores authorized by the authenticated membership
      responses:
        '200':
          description: Authorized stores only
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Store'}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Tenancy]
      operationId: createMerchantStore
      summary: Create a store as a merchant owner
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateStoreRequest'}
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Store'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/store-data-mode:
    put:
      tags: [Tenancy]
      operationId: rejectStoreDataModeMutation
      summary: Reject mutation of an activated merchant's locked ownership mode
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [store_data_mode]
              properties:
                store_data_mode: {enum: [shared, independent]}
      responses:
        '409': {$ref: '#/components/responses/Conflict'}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/context:
    post:
      tags: [Tenancy]
      operationId: resolveStoreContext
      summary: Validate a requested store against membership and return canonical tenant context
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Canonical authorized context
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/TenantContext'}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/carts:
    get:
      tags: [Checkout]
      operationId: listRegisterCarts
      summary: List the register's bounded active and suspended carts
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}]
      responses:
        '200': {description: Active and suspended carts, content: {application/json: {schema: {$ref: '#/components/schemas/CartListEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Checkout]
      operationId: createRegisterCart
      summary: Create an active mutable cart at a sellable inventory location
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCartRequest'}}}}
      responses:
        '201': {description: Cart created, content: {application/json: {schema: {$ref: '#/components/schemas/CartEnvelope'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/carts/{cartId}:
    get:
      tags: [Checkout]
      operationId: getRegisterCart
      summary: Read a tenant/store/register-bound cart and its current lines
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/CartId'}]
      responses:
        '200': {description: Cart, content: {application/json: {schema: {$ref: '#/components/schemas/CartEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Checkout]
      operationId: replaceRegisterCart
      summary: Optimistically replace the complete editable cart content
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/CartId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReplaceCartRequest'}}}}
      responses:
        '200': {description: Updated cart, content: {application/json: {schema: {$ref: '#/components/schemas/CartEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/carts/{cartId}/scan:
    post:
      tags: [Checkout]
      operationId: scanRegisterCartBarcode
      summary: Resolve a unit or configured scale barcode and add or increment its exact configuration
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/CartId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScanCartRequest'}}}}
      responses:
        '200': {description: Updated cart, content: {application/json: {schema: {$ref: '#/components/schemas/CartEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/carts/{cartId}/suspend:
    post:
      tags: [Checkout]
      operationId: suspendRegisterCart
      summary: Suspend a cart without reserving stock or creating a deposit
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/CartId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CartVersionRequest'}}}}
      responses:
        '200': {description: Suspended cart, content: {application/json: {schema: {$ref: '#/components/schemas/CartEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/carts/{cartId}/resume:
    post:
      tags: [Checkout]
      operationId: resumeRegisterCart
      summary: Resume a suspended cart for revalidation and editing
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/CartId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CartVersionRequest'}}}}
      responses:
        '200': {description: Active cart, content: {application/json: {schema: {$ref: '#/components/schemas/CartEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/carts/{cartId}/quotes:
    post:
      tags: [Checkout]
      operationId: quoteRegisterCart
      summary: Append an authoritative non-consuming quote for the current cart version
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/CartId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CartVersionRequest'}}}}
      responses:
        '201': {description: Cart and immutable quote snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/CartQuoteEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/sales:
    post:
      tags: [Sales]
      operationId: finalizeSale
      summary: Atomically finalize and fully settle one sale
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeSaleRequest'
      responses:
        '201':
          description: Sale finalized; printing/fiscal/email states are separate
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleEnvelope'
        '200':
          description: Identical sale command replayed from the original committed result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleEnvelope'}
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Retryable'
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/sales/{saleId}:
    get:
      tags: [Sales]
      operationId: getSale
      summary: Read an authorized sale projection
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/SaleId'}, {$ref: '#/components/parameters/RequestId'}]
      responses:
        '200':
          description: Authorized sale projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/sales/client-transactions/{clientTransactionId}:
    get:
      tags: [Sales]
      operationId: getSaleByClientTransaction
      summary: Resolve the committed result after a lost or uncertain response
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/RegisterId'
        - name: clientTransactionId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': {description: Committed sale result, content: {application/json: {schema: {$ref: '#/components/schemas/SaleEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/sales/{saleId}/returns:
    get:
      tags: [Sales]
      operationId: listSaleReturns
      summary: List linked return documents for one original sale
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/SaleId'}]
      responses:
        '200': {description: Linked returns, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Return'}}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Sales]
      operationId: postReturn
      summary: Post a sale-linked full or partial return
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/RegisterId'
        - $ref: '#/components/parameters/SaleId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: X-Approval-Token, in: header, required: false, schema: {type: string}, description: Required only for an approved late-return exception.}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostReturnRequest'
      responses:
        '201':
          description: Return posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/sales/{saleId}/exchanges:
    post:
      tags: [Sales]
      operationId: postExchange
      summary: Post a linked return and replacement sale
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/RegisterId'
        - $ref: '#/components/parameters/SaleId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - {name: X-Approval-Token, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostExchangeRequest'
      responses:
        '201':
          description: Linked return and new sale posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/sale-returns/{saleReturnId}:
    get:
      tags: [Sales]
      operationId: getSaleReturn
      summary: Read a linked return, receipt snapshot, tenders and exchange reference
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/SaleReturnId'}]
      responses:
        '200': {description: Return detail, content: {application/json: {schema: {$ref: '#/components/schemas/ReturnEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/sale-returns/{saleReturnId}/refund-tenders/{returnTenderId}/confirm:
    post:
      tags: [Sales]
      operationId: confirmSaleReturnRefundTender
      summary: Attach actual external refund evidence to a pending return tender
      parameters: [{$ref: '#/components/parameters/MerchantId'}, {$ref: '#/components/parameters/StoreId'}, {$ref: '#/components/parameters/RegisterId'}, {$ref: '#/components/parameters/SaleReturnId'}, {$ref: '#/components/parameters/ReturnTenderId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmReturnRefundRequest'}}}}
      responses:
        '200': {description: Confirmation recorded or identically replayed, content: {application/json: {schema: {$ref: '#/components/schemas/ReturnEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/cash-sessions:
    get:
      tags: [Cash]
      operationId: listCashSessions
      summary: List recent sessions for one register
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/RegisterId'}
      responses:
        '200': {description: Register cash sessions, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/CashSession'}}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Cash]
      operationId: openCashSession
      summary: Open the register's only active cash session
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/RegisterId'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OpenCashSessionRequest'}}}}
      responses:
        '201': {description: Session opened, content: {application/json: {schema: {$ref: '#/components/schemas/CashSessionEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/cash-sessions/{sessionId}:
    get:
      tags: [Cash]
      operationId: getCashSession
      summary: Get one session and its append-only movements
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/RegisterId'}
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200': {description: Cash session detail, content: {application/json: {schema: {$ref: '#/components/schemas/CashSessionEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/cash-sessions/{sessionId}/movements:
    post:
      tags: [Cash]
      operationId: postCashMovement
      summary: Post an authorized paid movement or linked supplier cash payment
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/RegisterId'}
        - {$ref: '#/components/parameters/SessionId'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PostCashMovementRequest'}}}}
      responses:
        '201': {description: Movement posted, content: {application/json: {schema: {$ref: '#/components/schemas/CashMovementEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/cash-sessions/{sessionId}/handover:
    post:
      tags: [Cash]
      operationId: handoverCashSession
      summary: Change drawer custody without ending the session
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/RegisterId'}
        - {$ref: '#/components/parameters/SessionId'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HandoverCashSessionRequest'}}}}
      responses:
        '201': {description: Custody handed over, content: {application/json: {schema: {$ref: '#/components/schemas/CashSessionEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/cash-sessions/{sessionId}/close:
    post:
      tags: [Cash]
      operationId: submitCashSessionCount
      summary: Submit a blind count and capture close cutoff and pending-sale evidence
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/RegisterId'}
        - {$ref: '#/components/parameters/SessionId'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubmitCashSessionCountRequest'}}}}
      responses:
        '200': {description: Count recorded; expected cash is revealed only when pending sales are zero, content: {application/json: {schema: {$ref: '#/components/schemas/CashSessionEnvelope'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/cash-sessions/{sessionId}/review:
    post:
      tags: [Cash]
      operationId: reviewCashSession
      summary: Manager approves close or reopens the drawer with an audited reason
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/RegisterId'}
        - {$ref: '#/components/parameters/SessionId'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCashSessionRequest'}}}}
      responses:
        '200': {description: Review recorded, content: {application/json: {schema: {$ref: '#/components/schemas/CashSessionEnvelope'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /merchants/{merchantId}/loyalty/program:
    get:
      tags: [Loyalty]
      operationId: getLoyaltyProgram
      summary: Read the merchant-wide programme, current version and rewards
      parameters: [{$ref: '#/components/parameters/MerchantId'}]
      responses:
        '200': {description: Programme or null}
        '403': {$ref: '#/components/responses/Forbidden'}
  /merchants/{merchantId}/loyalty/program/versions:
    post:
      tags: [Loyalty]
      operationId: publishLoyaltyProgramVersion
      summary: Publish an append-only earning/expiry version and replace the active reward set
      parameters: [{$ref: '#/components/parameters/MerchantId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, slug, points_per_pkr, rewards]
              properties:
                name: {type: string, minLength: 1, maxLength: 160}
                slug: {type: string, pattern: '^[A-Za-z0-9_-]{1,80}$'}
                points_per_pkr: {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,8})?$'}
                expiry_days: {type: [integer, 'null'], minimum: 1, maximum: 3650}
                rewards:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, points_required, discount_amount]
                    properties:
                      name: {type: string, minLength: 1, maxLength: 160}
                      points_required: {$ref: '#/components/schemas/Points'}
                      discount_amount: {$ref: '#/components/schemas/Money'}
                      is_active: {type: boolean, default: true}
      responses:
        '201': {description: Published programme version}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/loyalty/members:
    get:
      tags: [Loyalty]
      operationId: searchLoyaltyMembers
      summary: Search merchant-wide members without exposing linked store profiles
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {name: phone, in: query, schema: {type: string, maxLength: 32}}
        - {name: query, in: query, schema: {type: string, maxLength: 120}}
      responses: {'200': {description: Limited member list}}
    post:
      tags: [Loyalty]
      operationId: createLoyaltyMember
      summary: Create one merchant-wide member and zero balance projection
      parameters: [{$ref: '#/components/parameters/MerchantId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [name, phone], properties: {name: {type: string, maxLength: 160}, phone: {type: string, maxLength: 32}}}}}}
      responses: {'201': {description: Member created}, '422': {$ref: '#/components/responses/ValidationError'}}
  /merchants/{merchantId}/loyalty/members/{memberId}:
    get:
      tags: [Loyalty]
      operationId: getLoyaltyMemberLedger
      summary: Read the member balance and append-only ledger inside the merchant
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {name: memberId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      responses: {'200': {description: Member and recent ledger}, '404': {$ref: '#/components/responses/NotFound'}}
  /merchants/{merchantId}/loyalty/members/{memberId}/adjustments:
    post:
      tags: [Loyalty]
      operationId: adjustLoyaltyPoints
      summary: Append an authorized, reasoned manual points adjustment
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {name: memberId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [points, reason], properties: {points: {type: string, pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'}, reason: {type: string, minLength: 5, maxLength: 500}}}}}}
      responses: {'201': {description: Adjustment appended}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/carts/{cartId}/loyalty-redemptions:
    post:
      tags: [Loyalty]
      operationId: reserveLoyaltyRedemption
      summary: Reserve a configured reward online for one versioned cart
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/RegisterId'}
        - {$ref: '#/components/parameters/CartId'}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reward_id, expected_cart_version]
              properties:
                reward_id: {$ref: '#/components/schemas/Uuid'}
                expected_cart_version: {type: integer, minimum: 1}
      responses:
        '201': {description: Redemption reserved}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /merchants/{merchantId}/stores/{storeId}/registers/{registerId}/carts/{cartId}/loyalty-redemptions/{reservationId}:
    delete:
      tags: [Loyalty]
      operationId: releaseLoyaltyRedemption
      summary: Release the cart's active points reservation
      parameters:
        - {$ref: '#/components/parameters/MerchantId'}
        - {$ref: '#/components/parameters/StoreId'}
        - {$ref: '#/components/parameters/RegisterId'}
        - {$ref: '#/components/parameters/CartId'}
        - {name: reservationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200': {description: Reservation released or already released}
        '404': {$ref: '#/components/responses/NotFound'}
  /public/loyalty/{programSlug}:
    get:
      security: []
      tags: [Loyalty]
      operationId: publicGetLoyaltyProgramme
      summary: Read active programme name, reward thresholds and the phone-lookup notice
      parameters:
        - {name: programSlug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9-]{3,80}$'}}
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200': {description: Active public programme metadata}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /public/loyalty/{programSlug}/join:
    post:
      security: []
      tags: [Loyalty]
      operationId: publicJoinLoyalty
      summary: Join or resolve an existing member through the public program page
      parameters:
        - name: programSlug
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]{3,80}$'}
        - $ref: '#/components/parameters/RequestId'
