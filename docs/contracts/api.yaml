    get: {tags: [Reporting], operationId: listSavedReportFilters, responses: {'200': {description: Current user's saved definitions}}}
    post: {tags: [Reporting], operationId: saveReportFilter, summary: Save a definition after revalidating its store scope, responses: {'201': {description: Personal filter saved}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /merchants/{merchant}/stores/{store}/imports:
    post: {tags: [Data transfer], operationId: validateCsvImport, summary: Store a bounded UTF-8 CSV and return row-level dry-run validation, responses: {'201': {description: Import preview}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /merchants/{merchant}/stores/{store}/imports/{dataTransferJob}/commit:
    post: {tags: [Data transfer], operationId: commitCsvImport, summary: Atomically commit a fully valid preview with an Idempotency-Key, responses: {'200': {description: Import committed or replayed}, '409': {$ref: '#/components/responses/Conflict'}}}
  /merchants/{merchant}/stores/{store}/import-templates/{resource}.csv:
    get: {tags: [Data transfer], operationId: downloadImportTemplate, responses: {'200': {description: Version 1 CSV template}}}
  /merchants/{merchant}/exports:
    post: {tags: [Data transfer], operationId: queueDataExport, summary: Queue an authorized bounded CSV export, responses: {'202': {description: Export queued}}}
  /merchants/{merchant}/data-transfers/{dataTransferJob}:
    get: {tags: [Data transfer], operationId: getDataTransfer, responses: {'200': {description: Actor-owned transfer status and row outcomes}, '404': {$ref: '#/components/responses/NotFound'}}}
  /merchants/{merchant}/data-transfers/{dataTransferJob}/download:
    get: {tags: [Data transfer], operationId: downloadDataExport, responses: {'200': {description: Private formula-safe CSV artifact}, '404': {$ref: '#/components/responses/NotFound'}}}
  /merchants/{merchant}/receipts/{receipt}/email:
    post: {tags: [Notifications], operationId: queueReceiptEmail, summary: Queue an immutable PDF receipt independently of sale posting, responses: {'202': {description: Delivery queued or deduplicated}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /merchants/{merchant}/receipts/{receipt}/message:
    post: {tags: [Notifications], operationId: queueReceiptMessage, summary: Queue an optional SMS or WhatsApp receipt reference after configuration and opt-out checks, responses: {'202': {description: Delivery queued or deduplicated}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /merchants/{merchant}/notification-consents/opt-out:
    put: {tags: [Notifications], operationId: optOutNotificationRecipient, summary: Record an effective channel/purpose recipient opt-out, responses: {'200': {description: Opt-out recorded}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /merchants/{merchant}/notification-deliveries/{notificationDelivery}:
    get: {tags: [Notifications], operationId: getNotificationDelivery, responses: {'200': {description: Actor/owner delivery status and safe attempts}, '404': {$ref: '#/components/responses/NotFound'}}}
  /merchants/{merchant}/email-settings:
    get: {tags: [Notifications], operationId: getEmailSettings, summary: Return non-secret owner-only transport state, responses: {'200': {description: Email settings}}}
    put: {tags: [Notifications], operationId: updateEmailSettings, summary: Update non-secret sender and enable state, responses: {'200': {description: Email settings updated}}}
  /merchants/{merchant}/email-settings/test:
    post: {tags: [Notifications], operationId: queueTestEmail, responses: {'202': {description: Test delivery queued}}}
  /merchants/{merchant}/notification-preferences:
    put: {tags: [Notifications], operationId: updateNotificationPreferences, responses: {'200': {description: Current user operational preferences}}}
  /merchants/{merchant}/alerts:
    get: {tags: [Notifications], operationId: listOperationalAlerts, responses: {'200': {description: Authorized active alerts with per-user read state}}}
  /merchants/{merchant}/alerts/{inAppAlert}/read:
    post: {tags: [Notifications], operationId: markOperationalAlertRead, responses: {'200': {description: Read state recorded}}}
  /merchants/{merchant}/integrations:
    get: {tags: [Integrations], operationId: listMerchantIntegrations, summary: Return owner-only provider catalogue and redacted configuration state, responses: {'200': {description: Redacted integration catalogue}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /merchants/{merchant}/integrations/active:
    get: {tags: [Integrations], operationId: listActiveMerchantIntegrations, summary: Return staff-safe enabled capabilities without credentials, responses: {'200': {description: Active integration capabilities}}}
  /merchants/{merchant}/integrations/{provider}:
    put: {tags: [Integrations], operationId: updateMerchantIntegration, summary: Create or version an owner-managed provider configuration with encrypted secrets, responses: {'200': {description: Integration updated}, '201': {description: Integration created}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /merchants/{merchant}/integrations/{merchantIntegration}/test:
    post: {tags: [Integrations], operationId: testMerchantIntegration, summary: Run a safe connection/configuration test without sending a customer message or collecting payment, responses: {'200': {description: Safe test result}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /integrations/{merchantIntegration}/callbacks/meta:
    get: {tags: [Integrations], operationId: verifyMetaIntegrationCallback, security: [], summary: Complete Meta webhook challenge verification, responses: {'200': {description: Verified challenge}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {tags: [Integrations], operationId: receiveMetaIntegrationCallback, security: [], summary: Authenticate and deduplicate Meta delivery events, responses: {'200': {description: Callback accepted or deduplicated}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /integrations/{merchantIntegration}/callbacks/twilio:
    post: {tags: [Integrations], operationId: receiveTwilioIntegrationCallback, security: [], summary: Authenticate and deduplicate Twilio delivery events, responses: {'200': {description: Callback accepted or deduplicated}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /merchants/{merchant}/stores/{store}/fiscal:
    get: {tags: [Fiscal], operationId: getFiscalReadiness, responses: {'200': {description: 'Redacted configuration, documents, and blocked-authority reasons'}}}
    put: {tags: [Fiscal], operationId: configureFiscalAdapter, summary: Configure a redacted versioned authority profile; only FBR DI v1.12 sandbox can activate, responses: {'200': {description: Configuration updated}, '201': {description: Configuration created}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /merchants/{merchant}/stores/{store}/fiscal/{fiscalConfiguration}/mappings:
    post: {tags: [Fiscal], operationId: createFiscalProductMapping, summary: Add an effective-dated HS/UOM/rate/sale-type mapping, responses: {'201': {description: Mapping created}}}
  /merchants/{merchant}/fiscal/outbox/consume:
    post: {tags: [Fiscal], operationId: consumeFiscalOutbox, responses: {'202': {description: Applicable local documents queued once}}}
  /merchants/{merchant}/fiscal-documents/{fiscalDocument}/retry:
    post: {tags: [Fiscal], operationId: retryRejectedFiscalDocument, summary: Retry a rejected document with the same immutable identity; unknown outcomes are refused, responses: {'202': {description: Retry queued}, '409': {$ref: '#/components/responses/Conflict'}}}
  /merchants/{merchant}/fiscal-documents/{fiscalDocument}/reconcile:
    post: {tags: [Fiscal], operationId: reconcileUnknownFiscalDocument, summary: Record owner evidence from an official lookup or licensed integrator, responses: {'200': {description: Unknown outcome reconciled}, '409': {$ref: '#/components/responses/Conflict'}}}
  /merchants/{merchant}/reporting/catalog:
    get:
      tags: [Reporting]
      operationId: getReportingCatalog
      summary: Return authorized fixed reports, store choices and filter lookups.
      responses: {'200': {description: Role-scoped report catalogue}, '403': {$ref: '#/components/responses/Forbidden'}}
  /merchants/{merchant}/reporting/reports/{report}:
    get:
      tags: [Reporting]
      operationId: getReportingWorkspaceResult
      description: Live definition-version-2 result with typed columns, complete-filter summary, paginated rows, scope, period, freshness and limitations. Costs and margins are removed without permission. Cashiers are constrained to their own activity. Unknown historical dimensions are explicitly labelled.
      parameters:
        - {name: report, in: path, required: true, schema: {type: string}}
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {name: store_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: sort, in: query, schema: {type: string}, description: Allowlisted result column.}
        - {name: direction, in: query, schema: {enum: [asc, desc]}}
        - {name: search, in: query, schema: {type: string, maxLength: 120}}
        - {name: group_by, in: query, schema: {enum: [day, week, month, year]}}
        - {name: comparison, in: query, schema: {enum: [previous_period, previous_year]}}
      responses: {'200': {description: Report result envelope}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /merchants/{merchant}/reporting/reports/{report}/rows:
    get:
      tags: [Reporting]
      operationId: getReportingSourceRows
      summary: Read paginated source lines using the same filters and group_key.
      responses: {'200': {description: Authorized source rows}}
  /merchants/{merchant}/reporting/reports/{report}/exports:
    post:
      tags: [Reporting]
      operationId: queueReportingWorkspaceExport
      description: Private export on dedicated reports queue. Maximum one million rows for CSV/XLSX, 2000 detail rows for PDF. Reauthorization occurs at request, processing and download. Artifacts expire after seven days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: {enum: [csv, xlsx, pdf]}
                summary_only: {type: boolean, default: false}
      responses: {'202': {description: Export job accepted}, '403': {$ref: '#/components/responses/Forbidden'}}
  /merchants/{merchant}/reporting/exports:
    get: {tags: [Reporting], operationId: listReportingExports, responses: {'200': {description: Current user's latest authorized export jobs}}}
  /merchants/{merchant}/reporting/exports/{dataTransferJob}/download:
    get: {tags: [Reporting], operationId: downloadReportingExport, responses: {'200': {description: Private CSV XLSX or PDF attachment}, '403': {$ref: '#/components/responses/Forbidden'}, '410': {description: Artifact expired}}}
  /merchants/{merchant}/reporting/filters:
    get: {tags: [Reporting], operationId: listWorkspaceFilters, responses: {'200': {description: Personal saved filters}}}
    post: {tags: [Reporting], operationId: createWorkspaceFilter, responses: {'201': {description: Authorized personal filter saved}}}
  /merchants/{merchant}/reporting/filters/{savedReportFilter}:
    put: {tags: [Reporting], operationId: updateWorkspaceFilter, responses: {'200': {description: Personal filter updated after scope validation}}}
    delete: {tags: [Reporting], operationId: deleteWorkspaceFilter, responses: {'200': {description: Personal filter deleted}}}
  /merchants/{merchant}/reporting/setup:
    get: {tags: [Reporting], operationId: getReportingSetup, responses: {'200': {description: Scoped lookup codes, registers, reorder policies and paginated products}}}
  /merchants/{merchant}/reporting/setup/export.csv:
    get: {tags: [Reporting], operationId: exportReportingMetadata, responses: {'200': {description: Import-compatible complete SKU metadata CSV}}}
  /merchants/{merchant}/reporting/setup/{kind}:
    post: {tags: [Reporting], operationId: createReportingClassification, responses: {'201': {description: Scoped classification created}}}
  /merchants/{merchant}/reporting/setup/{kind}/{id}:
    put: {tags: [Reporting], operationId: editReportingClassification, responses: {'200': {description: Classification renamed or archived without rewriting transaction history}}}
  /merchants/{merchant}/reporting/products/{product}:
    put: {tags: [Reporting], operationId: assignReportingProductMetadata, responses: {'200': {description: Current product classifications assigned}}}
  /merchants/{merchant}/reporting/variants/{variant}:
    put: {tags: [Reporting], operationId: assignReportingVariantMetadata, responses: {'200': {description: Size and store reorder policy saved}}}
  /merchants/{merchant}/reporting/registers/{register}:
    put: {tags: [Reporting], operationId: assignReportingRegisterGroup, responses: {'200': {description: Owner-authorized register group saved}}}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mypos_session
      description: Secure HTTP-only same-origin session with CSRF protection.
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/device-tokens
          scopes:
            device:bootstrap: Provision an enrolled register snapshot
            device:sync: Submit commands for an enrolled register
            integration:read: Read explicitly granted integration resources
            integration:write: Submit explicitly granted integration commands
  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    StoreId:
      name: storeId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    RegisterId:
      name: registerId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    CartId:
      name: cartId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ProductId:
      name: productId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    VariantId:
      name: variantId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ImageId:
      name: imageId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    DeviceKey:
      name: X-Device-Key
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 255}
    DisplayToken:
      name: X-Display-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 255}
      description: Read-only credential distinct from every staff and device session.
    StaffSession:
      name: X-Staff-Session
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 255}
    PlanId:
      name: planId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: {$ref: '#/components/schemas/Uuid'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    Cursor:
      name: page[cursor]
      in: query
      required: false
      schema: {type: string, maxLength: 500}
    PageSize:
      name: page[size]
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    SaleId:
      name: saleId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SaleReturnId:
      name: saleReturnId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ReturnTenderId:
      name: returnTenderId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    PurchaseOrderId:
      name: purchaseOrderId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    PurchaseReceiptId:
      name: purchaseReceiptId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    PurchaseReturnId:
      name: purchaseReturnId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SupplierCreditId:
      name: supplierCreditId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SupplierPaymentId:
      name: supplierPaymentId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    TransferId:
      name: transferId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    StocktakeId:
      name: stocktakeId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
  headers:
    RequestId:
      description: Server correlation/request ID
      schema: {$ref: '#/components/schemas/Uuid'}
  responses:
    Unauthorized:
      description: Authentication missing or invalid
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: Actor is not authorized in the resolved merchant/store context
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: Resource absent or not disclosed in this scope
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ValidationError:
      description: Request validation failed; do not retry unchanged
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: State/version/idempotency/business conflict; inspect stable code before retry
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Retryable:
      description: Temporary infrastructure failure; same idempotency key may be retried
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    RateLimited:
      description: Request rate limited
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    CatalogUnit:
      type: object
      additionalProperties: false
      required: [id, code, name, symbol, decimal_places]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string, maxLength: 24}
        name: {type: string, maxLength: 80}
        symbol: {type: string, maxLength: 16}
        decimal_places: {type: integer, minimum: 0, maximum: 6}
    UnitListEnvelope:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/CatalogUnit'}}}
    CreateUnitRequest:
      type: object
      additionalProperties: false
      required: [code, name, symbol, decimal_places]
      properties:
        code: {type: string, maxLength: 24}
        name: {type: string, maxLength: 80}
        symbol: {type: string, maxLength: 16}
        decimal_places: {type: integer, minimum: 0, maximum: 6}
    CatalogBarcode:
      type: object
      additionalProperties: false
      required: [id, code, kind, is_primary]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string, maxLength: 64, description: String value; leading zeros are significant.}
        kind: {enum: [unit, scale_reference]}
        is_primary: {type: boolean}
    CatalogVariant:
      type: object
      additionalProperties: false
      required: [id, sku, name, attributes, is_weighted, is_default, base_unit, barcodes, conversions, bundle_components]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        sku: {type: string, maxLength: 80}
        name: {type: string, maxLength: 160}
        attributes: {type: object, additionalProperties: {type: string}}
        is_weighted: {type: boolean}
        is_default: {type: boolean}
        archived_at: {type: [string, 'null'], format: date-time}
        base_unit: {$ref: '#/components/schemas/CatalogUnit'}
        barcodes: {type: array, items: {$ref: '#/components/schemas/CatalogBarcode'}}
        conversions: {type: array, items: {type: object, required: [id, unit, factor_to_base], properties: {id: {$ref: '#/components/schemas/Uuid'}, unit: {$ref: '#/components/schemas/CatalogUnit'}, factor_to_base: {$ref: '#/components/schemas/Quantity'}}}}
        bundle_components: {type: array, items: {type: object, required: [variant_id, sku, product_name, quantity_base], properties: {variant_id: {$ref: '#/components/schemas/Uuid'}, sku: {type: string}, product_name: {type: string}, quantity_base: {$ref: '#/components/schemas/Quantity'}}}}
    CatalogProduct:
      type: object
      additionalProperties: false
      required: [id, scope, type, name, batch_tracking_enabled, structure_version, variants, extra_groups, images, store_availability]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        scope: {enum: [merchant, store]}
        type: {enum: [standard, weighted, bundle]}
        name: {type: string, maxLength: 180}
        description: {type: [string, 'null']}
        tax_classification_reference: {type: [string, 'null'], maxLength: 80}
        batch_tracking_enabled: {type: boolean}
        structure_version: {type: integer, minimum: 1}
        archived_at: {type: [string, 'null'], format: date-time}
        variants: {type: array, items: {$ref: '#/components/schemas/CatalogVariant'}}
        extra_groups: {type: array, items: {type: object}}
        images: {type: array, items: {type: object}}
        store_availability: {type: array, items: {type: object}}
    CatalogProductEnvelope:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/CatalogProduct'}}
    CatalogProductListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CatalogProduct'}}
        meta: {type: object}
        links: {type: object}
    CreateCatalogProductRequest:
      type: object
      additionalProperties: false
      required: [type, name, variants]
      properties:
        type: {enum: [standard, weighted, bundle]}
        name: {type: string, maxLength: 180}
        description: {type: [string, 'null'], maxLength: 5000}
        tax_classification_reference: {type: [string, 'null'], maxLength: 80}
        batch_tracking_enabled: {type: boolean, default: false}
        available_store_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        variants: {type: array, minItems: 1, maxItems: 200, items: {type: object}}
        extra_groups: {type: array, maxItems: 30, items: {type: object}}
    UpdateCatalogProductRequest:
      type: object
      additionalProperties: false
      required: [expected_structure_version]
      properties:
        expected_structure_version: {type: integer, minimum: 1}
        name: {type: string, maxLength: 180}
        description: {type: [string, 'null'], maxLength: 5000}
        tax_classification_reference: {type: [string, 'null'], maxLength: 80}
        archived: {type: boolean}
        batch_tracking_enabled: {type: boolean}
        batch_conversion_confirmed: {type: boolean}
        available_store_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
    ReplaceBundleComponentsRequest:
      type: object
      additionalProperties: false
      required: [expected_structure_version, components]
      properties:
        expected_structure_version: {type: integer, minimum: 1}
        components: {type: array, minItems: 1, maxItems: 100, items: {type: object, required: [variant_id, quantity_base], properties: {variant_id: {$ref: '#/components/schemas/Uuid'}, quantity_base: {$ref: '#/components/schemas/Quantity'}}}}
    BarcodeResolutionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [scan, matched_variant_id, product]
          properties:
            scan:
              type: object
              required: [raw_barcode, kind, quantity, embedded_price]
              properties:
                raw_barcode: {type: string}
                kind: {enum: [unit, scale]}
                quantity: {oneOf: [{$ref: '#/components/schemas/Quantity'}, {type: 'null'}]}
                embedded_price: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
            matched_variant_id: {$ref: '#/components/schemas/Uuid'}
            product: {$ref: '#/components/schemas/CatalogProduct'}
    CreateScaleBarcodeFormatRequest:
      type: object
      additionalProperties: false
      required: [scope, name, prefix, total_length, item_start, item_length, value_start, value_length, value_type, value_decimal_places, checksum]
      properties:
        scope: {enum: [merchant, store]}
        name: {type: string, maxLength: 120}
        prefix: {type: string, pattern: '^[0-9]{1,6}$'}
        total_length: {type: integer, minimum: 8, maximum: 32}
        item_start: {type: integer, minimum: 0, maximum: 31}
        item_length: {type: integer, minimum: 1, maximum: 20}
        value_start: {type: integer, minimum: 0, maximum: 31}
        value_length: {type: integer, minimum: 1, maximum: 20}
        value_type: {enum: [quantity, price]}
        value_decimal_places: {type: integer, minimum: 0, maximum: 6}
        checksum: {enum: [none, ean13]}
    RegisterCapabilities:
      type: object
      additionalProperties: false
      required: [scanner, printer, cash_drawer, customer_display]
      properties:
        scanner: {type: boolean}
        printer: {type: boolean}
        cash_drawer: {type: boolean}
        customer_display: {type: boolean}
    DeviceEnrollment:
      type: object
      additionalProperties: false
